# 前端容器里的反代规则：与开发用的 vite.config.js 保持一致
# （/login、/register、/auth 既是后端 POST 接口，也是前端路由）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 录像上传最大 250MB，和后端的 MEDIA_MAX_REQUEST_SIZE 对齐
    client_max_body_size 260m;

    location /api/ {
        proxy_pass http://backend:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 出题、分析这类同步长请求：别让 nginx 5 分钟就断开
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # L2 实时对话：WebSocket 升级 + 长连接（不设短的 read timeout）
    location /ws/ {
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(login|register|auth) {
        # GET 交回 SPA：否则在登录页刷新会被后端顶掉（开发环境同样处理）
        if ($request_method = GET) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 只公开健康检查；Prometheus 指标只允许通过 Docker 内网访问。
    location = /actuator/health {
        proxy_pass http://backend:8088;
    }

    location /actuator/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
