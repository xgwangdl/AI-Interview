name: build

# 版本策略要求「版本写入 Maven 与 npm lock 文件，并在 CI 中固定验证」。
# 这里跑的是本地已经验证过的三条命令：后端干净构建、前端干净安装后测试并构建。
# 需要 Postgres / S3 的集成用例由 -Ddb.integration / -Ds3.integration 控制，
# 默认在 CI 中跳过；要纳入 CI 时再补一个带 service containers 的 job。
#
# 注意：runner 镜像里只有 emoji 字体，**没有任何中文字体**，而简历导出的 PDF 必须内嵌中文字体
# （没有时后端会明确报错，见 ResumePdfFonts）。这里装的是 **TrueType** 的 wqy-zenhei：
# Debian/Ubuntu 常见的 fonts-noto-cjk 是 CFF 轮廓，PDFBox 能加载却不能内嵌（OTF fonts do not have a glyf table），
# 装它等于没装。不装任何字体的话，ResumePdfExporterTest 会跳过，CI 也就不覆盖 PDF 版式。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install a CJK font (the PDF export embeds one)
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei

      - name: Backend build and tests
        run: mvn -B clean package

      # 失败时把 surefire 报告传上来：不然只能登录网页点开日志才能看到是哪个用例挂了
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend install, test and build
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npx vite --host 127.0.0.1 --port 4173 > /tmp/light-interview-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/login > /dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 npm run test:e2e
          npm run build

      - name: Upload auth E2E evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-e2e-evidence
          path: reports/evidence/auth
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: interview
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d interview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      s3mock:
        image: adobe/s3mock:latest
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: light-interview-media
        ports:
          - 9090:9090
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Wait for S3 mock
        run: |
          for i in $(seq 1 30); do
            if curl --silent --show-error http://127.0.0.1:9090/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Database and S3 integration tests
        run: mvn -B test -Ddb.integration=true -Ds3.integration=true
      - name: Upload integration reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Docker sandbox tests
        run: >-
          mvn -B -pl consumer -am test
          "-Dtest=CodeRunnerServiceTest"
          "-Dcode.runner.integration=true"
          "-Dsurefire.failIfNoSpecifiedTests=false"
      - name: Upload sandbox reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore
