spring:
  mail:
    protocol: smtp                   # 邮件协议
    host: smtp.163.com               # smtp 服务器地址 （163邮箱为例）
    port: 25                         # 端口号（163邮箱为例）
    username: ${USER_NAME:}          # 发送人邮箱地址（未配置时邮件不可用，但不影响启动）
    password: ${PASS_WORD:}          # 授权码
    default-encoding: utf-8          # 编码字符集
    debug: true                      # 开启debug模式用户会完整打印邮件发送过程的日志

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/interview}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "CREATE EXTENSION IF NOT EXISTS vector;"
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: true
        dimensions: 1536
        schema-name: public
        table-name: vector_store
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
