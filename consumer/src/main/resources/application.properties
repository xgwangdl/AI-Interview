# 阿里云百炼（DashScope）：未配置 Key 时仅云端能力不可用，不影响应用启动
spring.ai.dashscope.api-key=${Ali_API_KEY:}
spring.ai.dashscope.chat.options.model=qwen-max
#spring.ai.dashscope.chat.options.model=deepseek-v3
#spring.ai.dashscope.chat.options.model=qwen-plus
spring.ai.dashscope.embedding.options.model=text-embedding-v2
spring.ai.dashscope.image.options.model=wanx-v1
spring.ai.dashscope.audio.speech.api-key=${Ali_API_KEY:}
spring.ai.dashscope.audio.speech.options.model=sambert-zhixiang-v1
spring.ai.dashscope.audio.transcription.api-key=${Ali_API_KEY:}

server.port=${SERVER_PORT:8088}

spring.flyway.enabled=${PRACTICE_FLYWAY_ENABLED:true}
spring.servlet.multipart.max-file-size=${MEDIA_MAX_FILE_SIZE:250MB}
spring.servlet.multipart.max-request-size=${MEDIA_MAX_REQUEST_SIZE:250MB}
practice.media.storage-dir=${MEDIA_STORAGE_DIR:./data/media}
practice.media.provider=${MEDIA_PROVIDER:local}
practice.media.retention-days=${MEDIA_RETENTION_DAYS:7}
practice.media.signed-url-ttl-seconds=${MEDIA_SIGNED_URL_TTL_SECONDS:300}

practice.media.s3.endpoint=${MEDIA_S3_ENDPOINT:}
practice.media.s3.region=${MEDIA_S3_REGION:us-east-1}
practice.media.s3.bucket=${MEDIA_S3_BUCKET:light-interview-media}
practice.media.s3.access-key=${MEDIA_S3_ACCESS_KEY:}
practice.media.s3.secret-key=${MEDIA_S3_SECRET_KEY:}
practice.media.s3.path-style-access=${MEDIA_S3_PATH_STYLE:true}

practice.analysis.max-attempts=${PRACTICE_ANALYSIS_MAX_ATTEMPTS:3}
practice.analysis.provider-timeout-ms=${PRACTICE_ANALYSIS_PROVIDER_TIMEOUT_MS:120000}
practice.analysis.poll-interval-ms=${PRACTICE_ANALYSIS_POLL_INTERVAL_MS:15000}
practice.analysis.initial-delay-ms=${PRACTICE_ANALYSIS_INITIAL_DELAY_MS:30000}
# 失败重试的指数退避：第 n 次失败后等 retry-backoff-ms × 2^(n-1)，上限 retry-backoff-max-ms
practice.analysis.retry-backoff-ms=${PRACTICE_ANALYSIS_RETRY_BACKOFF_MS:5000}
practice.analysis.retry-backoff-max-ms=${PRACTICE_ANALYSIS_RETRY_BACKOFF_MAX_MS:300000}

# 转写与评分供应商：dashscope / spring-ai 为真实实现，stub 为无凭证的本地兜底
practice.asr.provider=${PRACTICE_ASR_PROVIDER:dashscope}
practice.evaluation.provider=${PRACTICE_EVALUATION_PROVIDER:spring-ai}

practice.avatar.provider=${PRACTICE_AVATAR_PROVIDER:local-2d}
practice.avatar.tts-enabled=${PRACTICE_AVATAR_TTS_ENABLED:true}
practice.avatar.voice=${PRACTICE_AVATAR_VOICE:sambert-zhixiang-v1}

auth.token.secret: ${AUTH_TOKEN_SECRET:change-this-development-secret}
# 令牌有效期（小时）。一轮练习 20 分钟左右，别设得太短，否则面试中途就会 401。
auth.token.ttl-hours=${AUTH_TOKEN_TTL_HOURS:12}

# 登录限流：同一用户名连续失败超过阈值后，锁定一段时间
auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:10}
auth.login.lock-window-minutes=${AUTH_LOGIN_LOCK_WINDOW_MINUTES:15}

# 浏览器直连后端时允许的来源（Vite 开发服务器）。生产同源部署可留空。
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# 可观测性（#10）：分析队列指标通过 /actuator/prometheus 暴露，Prometheus 直接抓取。
# 注意：actuator 目前与应用同端口且未鉴权，生产部署请用管理端口或网关限制访问。
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# 代码沙箱：会在本机 Docker 里执行任意用户代码，默认关闭，确认环境后显式打开。
# 打开前请确认：只在自己可控的机器上运行，且不要在公网直接暴露。
practice.code-runner.enabled=${CODE_RUNNER_ENABLED:false}
practice.code-runner.max-concurrency=${CODE_RUNNER_MAX_CONCURRENCY:2}
practice.code-runner.compile-timeout-seconds=${CODE_RUNNER_COMPILE_TIMEOUT_SECONDS:10}
practice.code-runner.run-timeout-seconds=${CODE_RUNNER_RUN_TIMEOUT_SECONDS:5}
practice.code-runner.memory-mb=${CODE_RUNNER_MEMORY_MB:256}

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=WARN

# 简历导出 PDF 用的中文字体（.ttf / .ttc）。留空时自动按
# Windows / macOS / Linux 的常见路径查找；系统里没有中文字体时才需要在这里指定。
resume.export.pdf-font=${RESUME_PDF_FONT:}
resume.export.pdf-font-bold=${RESUME_PDF_FONT_BOLD:}

spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

spring.webflux.multipart.enabled=true

